<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      body { display: flex; }
      #panel { width: 420px; flex: none; overflow-y: auto; padding: 10px; box-sizing: border-box; border-right: 1px solid #333; }
      #game { flex: 1; min-width: 0; height: 100%; }
      canvas { image-rendering: pixelated; }
      h2 { font-size: 12px; margin: 12px 0 4px; color: #9cf; text-transform: uppercase; letter-spacing: .05em; }
      .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
      .mon { border: 1px solid #333; border-radius: 4px; padding: 6px; margin: 6px 0; background: #181818; }
      .mon .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
      input, select, button { font: inherit; background: #222; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 2px 4px; }
      input.species { width: 150px; } input.level { width: 42px; } input.item { width: 120px; }
      input.bad { border-color: #e55; }
      button { cursor: pointer; } button:hover { background: #2c2c2c; }
      button.primary { background: #2a5; border-color: #3b6; color: #fff; padding: 4px 12px; }
      button.x { padding: 0 6px; margin-left: auto; }
      #status { margin-top: 8px; color: #fc6; white-space: pre-wrap; }
      .hint { color: #888; }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="game"></div>
    <script type="module" src="/src/battleTest.ts"></script>
  </body>
</html>
